<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — FreshWorks</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="site-nav"></header>
<section class="section">
  <div class="container" style="max-width:440px;">
    <div class="card">
      <h2 class="text-center" style="margin-top:0;">Welcome back</h2>
      <p class="muted text-center">Log in to your FreshWorks dashboard</p>
      <div class="form-msg" id="form-msg"></div>
      <form id="login-form">
        <div class="form-group"><label for="email">Email</label>
          <input class="form-control" type="email" id="email" required autocomplete="email"></div>
        <div class="form-group"><label for="password">Password</label>
          <input class="form-control" type="password" id="password" required autocomplete="current-password"></div>
        <button class="btn btn-primary btn-block" type="submit" id="login-btn">Log in</button>
      </form>
      <p class="muted text-center" style="margin-top:16px;font-size:.9rem;">No account? <a href="register.html" style="color:var(--primary);font-weight:600;">Start a free trial</a></p>
      <p class="muted text-center" style="font-size:.8rem;">Demo: dev@freshworks-demo.com / Agent@123</p>
    </div>
  </div>
</section>
<footer id="site-footer"></footer>
<script src="data/content.js"></script>
<script src="js/main.js"></script>
<script src="js/api.js"></script>
<script>
  if (localStorage.getItem('fw_token')) window.location.href = 'dashboard.html';
  const form = document.getElementById('login-form'), box = document.getElementById('form-msg'), btn = document.getElementById('login-btn');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true; btn.textContent = 'Logging in...'; box.className = 'form-msg';
    try {
      const data = await Api.login({ email: form.email.value, password: form.password.value });
      localStorage.setItem('fw_token', data.token);
      localStorage.setItem('fw_user', JSON.stringify(data.user));
      box.className = 'form-msg success'; box.textContent = 'Login successful! Redirecting...';
      setTimeout(() => window.location.href = 'dashboard.html', 600);
    } catch (err) {
      box.className = 'form-msg error'; box.textContent = err.message;
      btn.disabled = false; btn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
