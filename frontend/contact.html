<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — FreshWorks</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="site-nav"></header>

<section class="hero" style="padding-bottom:0;">
  <div class="container text-center">
    <div class="eyebrow" style="justify-content:center;">Contact</div>
    <h1>Talk to a human, not a bot</h1>
    <p class="lead" style="margin:14px auto 0;">Questions about pricing, migration, or anything else — we usually reply within a few hours.</p>
  </div>
</section>

<section class="section">
  <div class="container grid-2">
    <div class="card">
      <h3>Send us a message</h3>
      <div class="form-msg" id="form-msg"></div>
      <form id="contact-form">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Full name</label>
            <input class="form-control" type="text" id="name" name="name" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" required>
          </div>
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <input class="form-control" type="text" id="subject" name="subject" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea class="form-control" id="message" name="message" required></textarea>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="contact-submit">Send message</button>
      </form>
    </div>
    <div>
      <div class="card" style="margin-bottom:18px;">
        <h3>Email</h3>
        <p id="contact-email" style="margin-bottom:0;"></p>
      </div>
      <div class="card" style="margin-bottom:18px;">
        <h3>Phone</h3>
        <p id="contact-phone" style="margin-bottom:0;"></p>
      </div>
      <div class="card">
        <h3>Office</h3>
        <p id="contact-address" style="margin-bottom:0;"></p>
      </div>
    </div>
  </div>
</section>

<footer id="site-footer"></footer>
<script src="data/content.js"></script>
<script src="js/main.js"></script>
<script src="js/api.js"></script>
<script>
  document.getElementById('contact-email').textContent = SITE_DATA.brand.email;
  document.getElementById('contact-phone').textContent = SITE_DATA.brand.phone;
  document.getElementById('contact-address').textContent = SITE_DATA.brand.address;

  const form = document.getElementById('contact-form');
  const msgBox = document.getElementById('form-msg');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('contact-submit');
    btn.disabled = true; btn.textContent = 'Sending...';
    msgBox.className = 'form-msg';
    const payload = {
      name: form.name.value, email: form.email.value,
      subject: form.subject.value, message: form.message.value
    };
    try {
      await Api.sendContact(payload);
      msgBox.className = 'form-msg success';
      msgBox.textContent = "Thanks! We've received your message and will reply by email shortly.";
      form.reset();
    } catch (err) {
      msgBox.className = 'form-msg error';
      msgBox.textContent = err.message;
    }
    btn.disabled = false; btn.textContent = 'Send message';
  });
</script>
</body>
</html>
